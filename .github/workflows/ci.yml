name: WasteLens checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run automated checks
        run: npm run check
      - name: Build frontend
        run: npm run build
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check training script syntax
        run: python -m py_compile training/train_wastelens.py training/prepare_realwaste.py training/train_realwaste.py
